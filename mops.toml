# Motoko build config (single mops.toml per project, at the root).
# Add dependencies with: mops add <package>

[toolchain]
# Every command that compiles (build/check/test) uses the pinned moc.
moc = "0.14.4"

[dependencies]

[canisters.backend]
main = "src/backend/main.mo"

[build]
outputDir = "src/backend/dist"